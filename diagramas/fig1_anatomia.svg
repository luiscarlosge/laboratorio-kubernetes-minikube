</defs><rect width="880" height="440" fill="#ffffff"/><text class="cap" x="20" y="26">Anatomía de un clúster de Kubernetes</text><rect class="marco" x="20" y="46" width="840" height="330"/><text class="zona" x="34" y="68">Nodo único de minikube (en un clúster real, máquinas separadas)</text><rect x="38" y="82" width="480" height="150" fill="#f7fafd" stroke="#2E74B5" stroke-width="1.2" rx="3"/><text class="zona" x="52" y="104">PLANO DE CONTROL · decide qué debe pasar</text><rect class="boxp" x="52" y="116" width="220" height="46" rx="2"/><text class="tb" x="162.0" y="138.0" text-anchor="middle">kube-apiserver</text><text class="s" x="162.0" y="154.0" text-anchor="middle">única puerta de entrada</text><rect class="boxp" x="286" y="116" width="220" height="46" rx="2"/><text class="tb" x="396.0" y="138.0" text-anchor="middle">etcd</text><text class="s" x="396.0" y="154.0" text-anchor="middle">estado declarado</text><rect class="boxp" x="52" y="172" width="220" height="46" rx="2"/><text class="tb" x="162.0" y="194.0" text-anchor="middle">kube-scheduler</text><text class="s" x="162.0" y="210.0" text-anchor="middle">asigna Pods a nodos</text><rect class="boxp" x="286" y="172" width="220" height="46" rx="2"/><text class="tb" x="396.0" y="194.0" text-anchor="middle">kube-controller-manager</text><text class="s" x="396.0" y="210.0" text-anchor="middle">bucle de reconciliación</text><rect x="38" y="250" width="480" height="96" fill="#fafafa" stroke="#12263a" stroke-width="1.2" rx="3"/><text class="zona" x="52" y="272">COMPONENTES DE NODO · ejecutan lo decidido</text><rect class="box" x="52" y="284" width="146" height="46" rx="2"/><text class="tb" x="125.0" y="306.0" text-anchor="middle">kubelet</text><text class="s" x="125.0" y="322.0" text-anchor="middle">agente del nodo</text><rect class="box" x="208" y="284" width="146" height="46" rx="2"/><text class="tb" x="281.0" y="306.0" text-anchor="middle">kube-proxy</text><text class="s" x="281.0" y="322.0" text-anchor="middle">reglas de red</text><rect class="box" x="364" y="284" width="146" height="46" rx="2"/><text class="tb" x="437.0" y="306.0" text-anchor="middle">containerd</text><text class="s" x="437.0" y="322.0" text-anchor="middle">runtime</text><rect x="556" y="82" width="286" height="290" fill="#f4faf9" stroke="#0B6E6A" stroke-width="1.2" rx="3"/><text class="zona" x="570" y="104" fill="#0B6E6A">CARGAS DE TRABAJO · namespace lab</text><rect class="boxt" x="572" y="116" width="254" height="40" rx="2"/><text class="tb" x="699.0" y="140.0" text-anchor="middle">Deployment guia</text><rect class="boxt" x="572" y="172" width="254" height="40" rx="2"/><text class="tb" x="699.0" y="191.0" text-anchor="middle">ReplicaSet</text><text class="s" x="699.0" y="207.0" text-anchor="middle">garantiza 2 réplicas</text><rect class="boxt" x="572" y="236" width="120" height="52" rx="2"/><text class="tb" x="632.0" y="261.0" text-anchor="middle">Pod</text><text class="s" x="632.0" y="277.0" text-anchor="middle">nginx :80</text><rect class="boxt" x="706" y="236" width="120" height="52" rx="2"/><text class="tb" x="766.0" y="261.0" text-anchor="middle">Pod</text><text class="s" x="766.0" y="277.0" text-anchor="middle">nginx :80</text><rect class="boxo" x="572" y="308" width="254" height="44" rx="2"/><text class="tb" x="699.0" y="329.0" text-anchor="middle">Service guia</text><text class="s" x="699.0" y="345.0" text-anchor="middle">NodePort 30080</text><path class="fl" d="M699,156 L699,168"/><path class="fl" d="M660,212 L640,232"/><path class="fl" d="M738,212 L758,232"/><path class="flg" d="M632,304 L632,292"/><path class="flg" d="M766,304 L766,292"/><path class="fl" d="M522,196 L552,196"/><text class="s" x="40" y="390">Compruébelo con kubectl get pods -n kube-system: el propio plano de control corre como Pods.</text><text class="s" x="40" y="412">Kubernetes se administra a sí mismo con sus propias reglas.</text></svg>