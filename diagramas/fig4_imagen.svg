</defs><rect width="880" height="395" fill="#ffffff"/><text class="cap" x="20" y="26">Del Dockerfile a la imagen: capas y almacenes</text><rect class="marco" x="20" y="52" width="330" height="290"/><text class="zona" x="34" y="76">Capas de la imagen (de abajo hacia arriba)</text><rect class="boxo" x="38" y="96" width="294" height="40" rx="2"/><text class="tb" x="52" y="114">COPY index.html</text><text class="s" x="52" y="129">lo que más cambia: va de último</text><rect class="box" x="38" y="144" width="294" height="40" rx="2"/><text class="tb" x="52" y="162">RUN chmod +x …</text><text class="s" x="52" y="177">permisos del script de arranque</text><rect class="box" x="38" y="192" width="294" height="40" rx="2"/><text class="tb" x="52" y="210">COPY 30-pod-info.sh</text><text class="s" x="52" y="225">identidad del Pod</text><rect class="box" x="38" y="240" width="294" height="40" rx="2"/><text class="tb" x="52" y="258">COPY 00-keepalive.conf</text><text class="s" x="52" y="273">configuración de nginx</text><rect class="boxp" x="38" y="288" width="294" height="40" rx="2"/><text class="tb" x="52" y="306">FROM nginx:1.29-alpine</text><text class="s" x="52" y="321">capa base ~50 MB</text><text class="s" x="20" y="362">Editar el HTML invalida su capa y las posteriores; por eso va de último y la</text><text class="s" x="20" y="380">reconstrucción tarda segundos.</text><rect class="marco" x="386" y="52" width="474" height="290"/><text class="zona" x="400" y="76">Dos almacenes distintos, y ahí está el error más común</text><rect class="box" x="404" y="92" width="200" height="56" rx="2"/><text class="tb" x="504.0" y="119.0" text-anchor="middle">Docker de la VM</text><text class="s" x="504.0" y="135.0" text-anchor="middle">docker images</text><rect class="boxt" x="642" y="92" width="200" height="56" rx="2"/><text class="tb" x="742.0" y="119.0" text-anchor="middle">containerd del nodo</text><text class="s" x="742.0" y="135.0" text-anchor="middle">minikube image ls</text><text class="s" x="608" y="124">✕</text><path d="M610,120 L636,120" stroke="#B3372E" stroke-width="1.4" stroke-dasharray="3 3"/><text class="s" x="404" y="186">Tres caminos para que el clúster vea la imagen:</text><rect class="box" x="404" y="200" width="438" height="38" rx="2"/><text class="tb" x="418" y="217" font-family="DejaVu Sans Mono, monospace" font-size="11.5">minikube image build -t portal:1.0 .</text><text class="s" x="418" y="231">construye adentro · lo que usamos</text><rect class="box" x="404" y="246" width="438" height="38" rx="2"/><text class="tb" x="418" y="263" font-family="DejaVu Sans Mono, monospace" font-size="11.5">docker build + minikube image load</text><text class="s" x="418" y="277">probar el contenedor suelto antes</text><rect class="box" x="404" y="292" width="438" height="38" rx="2"/><text class="tb" x="418" y="309" font-family="DejaVu Sans Mono, monospace" font-size="11.5">docker push registro/portal:1.0</text><text class="s" x="418" y="323">lo real: cualquier nodo la descarga</text></svg>