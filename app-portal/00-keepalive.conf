# Sin conexiones persistentes: cada petición abre una conexión TCP nueva, y
# kube-proxy la reparte otra vez entre las réplicas. Es lo que permite que el
# botón "Pedir la página otra vez" muestre un Pod distinto. En producción esto
# se deja habilitado, porque reutilizar la conexión es más eficiente.
keepalive_timeout 0;
