<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>
